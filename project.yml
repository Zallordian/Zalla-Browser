name: Zalla
options:
  bundleIdPrefix: com.zalla
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "34"
targets:
  Zalla:
    type: application
    platform: iOS
    sources: [Zalla, Shared]
    dependencies:
      - target: ZallaWidgets
    # App Group shared with the widgets (group.com.zalla.browser). The default browser entitlement is NOT here
    # on purpose, Apple has to approve it first, see docs/DEFAULT_BROWSER.md.
    entitlements:
      path: config/Zalla.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zalla.browser
    info:
      path: Zalla/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Zalla
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.zalla.browser.open
            CFBundleURLSchemes:
              - zalla
          # Lets Zalla receive web links once it is chosen as the default browser (needs Apple's approval,
          # see docs/DEFAULT_BROWSER.md). Safari stays the default until then.
          - CFBundleURLName: com.zalla.browser.web
            CFBundleURLSchemes:
              - http
              - https
        # Press and hold the app icon. Routed by QuickActions.swift (types are typePrefix + case name).
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.zalla.browser.quickaction.newTab
            UIApplicationShortcutItemTitle: New Tab
            UIApplicationShortcutItemIconSymbolName: plus
          - UIApplicationShortcutItemType: com.zalla.browser.quickaction.newPrivateTab
            UIApplicationShortcutItemTitle: New Private Tab
            UIApplicationShortcutItemIconSymbolName: eye.slash
          - UIApplicationShortcutItemType: com.zalla.browser.quickaction.search
            UIApplicationShortcutItemTitle: Search
            UIApplicationShortcutItemIconSymbolName: magnifyingglass
          - UIApplicationShortcutItemType: com.zalla.browser.quickaction.bookmarks
            UIApplicationShortcutItemTitle: Bookmarks
            UIApplicationShortcutItemIconSymbolName: book
          - UIApplicationShortcutItemType: com.zalla.browser.quickaction.burn
            UIApplicationShortcutItemTitle: Burn It All
            UIApplicationShortcutItemIconSymbolName: flame
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSPhotoLibraryAddUsageDescription: Zalla saves exported images to Photos when you choose Save to Photos.
        NSCameraUsageDescription: Zalla uses the camera only when a website you are visiting asks for it and you allow it.
        NSFaceIDUsageDescription: Zalla uses Face ID only to unlock your private tabs, if you turn that on in Settings.
        NSMicrophoneUsageDescription: Zalla uses the microphone only when a website you are visiting asks for it and you allow it.
        NSLocationWhenInUseUsageDescription: Sites you choose can ask for your location, for things like weather and nearby businesses. Zalla asks you first, and your location goes only to the site you allow.
        NSLocalNetworkUsageDescription: Zalla connects to devices on your local network only when you open their address.
        UIBackgroundModes:
          - audio
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
            UIPrerenderedIcon: false
          CFBundleAlternateIcons:
            AppIconDark:
              CFBundleIconFiles:
                - AppIconDark
              UIPrerenderedIcon: false
            AppIconTinted:
              CFBundleIconFiles:
                - AppIconTinted
              UIPrerenderedIcon: false
            AppIconOrange:
              CFBundleIconFiles:
                - AppIconOrange
              UIPrerenderedIcon: false
            AppIconYellow:
              CFBundleIconFiles:
                - AppIconYellow
              UIPrerenderedIcon: false
            AppIconGreen:
              CFBundleIconFiles:
                - AppIconGreen
              UIPrerenderedIcon: false
            AppIconBlue:
              CFBundleIconFiles:
                - AppIconBlue
              UIPrerenderedIcon: false
            AppIconIndigo:
              CFBundleIconFiles:
                - AppIconIndigo
              UIPrerenderedIcon: false
            AppIconViolet:
              CFBundleIconFiles:
                - AppIconViolet
              UIPrerenderedIcon: false
            AppIconOcean:
              CFBundleIconFiles:
                - AppIconOcean
              UIPrerenderedIcon: false
            AppIconForest:
              CFBundleIconFiles:
                - AppIconForest
              UIPrerenderedIcon: false
            AppIconSpace:
              CFBundleIconFiles:
                - AppIconSpace
              UIPrerenderedIcon: false
            AppIconJungle:
              CFBundleIconFiles:
                - AppIconJungle
              UIPrerenderedIcon: false
            AppIconVolcano:
              CFBundleIconFiles:
                - AppIconVolcano
              UIPrerenderedIcon: false
            AppIconDeepOcean:
              CFBundleIconFiles:
                - AppIconDeepOcean
              UIPrerenderedIcon: false
            AppIconRetroArcade:
              CFBundleIconFiles:
                - AppIconRetroArcade
              UIPrerenderedIcon: false
            AppIconNeonCity:
              CFBundleIconFiles:
                - AppIconNeonCity
              UIPrerenderedIcon: false
            AppIconArctic:
              CFBundleIconFiles:
                - AppIconArctic
              UIPrerenderedIcon: false
            AppIconCherryBlossom:
              CFBundleIconFiles:
                - AppIconCherryBlossom
              UIPrerenderedIcon: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zalla.browser
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconDark AppIconTinted AppIconOrange AppIconYellow AppIconGreen AppIconBlue AppIconIndigo AppIconViolet AppIconOcean AppIconForest AppIconSpace AppIconJungle AppIconVolcano AppIconDeepOcean AppIconRetroArcade AppIconNeonCity AppIconArctic AppIconCherryBlossom
  # Widgets (Build 29). Own bundle ID, own provisioning profile, same App Group as the app.
  # To drop widgets entirely: remove this target, the ZallaWidgets dependency above, and the ZallaWidgets folder.
  # See docs/WIDGETS.md for the Apple Developer portal steps this target needs before it can be signed.
  ZallaWidgets:
    type: app-extension
    platform: iOS
    # ZallaWidgets/PrivacyInfo.xcprivacy is picked up from this folder and copied into the extension as a resource.
    sources: [ZallaWidgets, Shared]
    entitlements:
      path: config/ZallaWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zalla.browser
    info:
      path: ZallaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Zalla
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zalla.browser.widgets
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
  ZallaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ZallaTests]
    dependencies:
      - target: Zalla
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Zalla:
    build:
      targets:
        Zalla: all
    run:
      config: Debug
      storeKitConfiguration: Zalla.storekit
    test:
      targets: [ZallaTests]
