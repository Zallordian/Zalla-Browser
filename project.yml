name: Zalla
options:
  bundleIdPrefix: com.zalla
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "8"
targets:
  Zalla:
    type: application
    platform: iOS
    sources: [Zalla]
    info:
      path: Zalla/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Zalla
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSPhotoLibraryAddUsageDescription: Zalla saves exported images to Photos when you choose Save to Photos.
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
            UIPrerenderedIcon: false
          CFBundleAlternateIcons:
            AppIconDark:
              CFBundleIconFiles:
                - AppIconDark
              UIPrerenderedIcon: false
            AppIconTinted:
              CFBundleIconFiles:
                - AppIconTinted
              UIPrerenderedIcon: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zalla.browser
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
  ZallaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ZallaTests]
    dependencies:
      - target: Zalla
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Zalla:
    build:
      targets:
        Zalla: all
    test:
      targets: [ZallaTests]
